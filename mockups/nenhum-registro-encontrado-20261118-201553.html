<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nenhum registro encontrado.</title>
<style>
:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --border: #e2e4e9;
  --text: #1c1d21;
  --text-muted: #6b7076;
  --primary: #5b5bf0;
  --primary-text: #ffffff;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(16, 17, 20, 0.04), 0 4px 10px rgba(16, 17, 20, 0.04);
  --font: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  display: flex;
  justify-content: center;
  padding: 40px 20px;
}
.tela {
  width: 100%;
  max-width: 560px;
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  overflow: hidden;
}
.tela.larga { max-width: 860px; }
.cabecalho {
  padding: 24px 28px 20px;
  border-bottom: 1px solid var(--border);
}
.cabecalho h1 {
  margin: 0;
  font-size: 19px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.cabecalho p {
  margin: 4px 0 0;
  font-size: 13px;
  color: var(--text-muted);
}
.corpo { padding: 24px 28px 28px; }
.campo { margin-bottom: 18px; }
.campo label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 6px;
  color: var(--text);
}
.campo input, .campo textarea, .campo select {
  width: 100%;
  padding: 10px 12px;
  font-size: 14px;
  font-family: inherit;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #fbfbfc;
  color: var(--text-muted);
}
.campo textarea { resize: none; height: 72px; }
.rodape {
  padding: 18px 28px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}
.btn {
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 500;
  border-radius: 8px;
  border: 1px solid transparent;
  cursor: default;
  font-family: inherit;
}
.btn-principal { background: var(--primary); color: var(--primary-text); }
.btn-secundario { background: var(--surface); color: var(--text); border-color: var(--border); }

table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th {
  text-align: left;
  padding: 10px 12px;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  font-weight: 600;
}
td {
  padding: 11px 12px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
}
tr:last-child td { border-bottom: none; }
.pill {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 500;
  background: #eef0ff;
  color: var(--primary);
}

.grade-kpi {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 14px;
}
.kpi {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  background: #fbfbfc;
}
.kpi .valor { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
.kpi .label { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }

.detalhe-linha {
  display: flex;
  justify-content: space-between;
  padding: 13px 0;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}
.detalhe-linha:last-child { border-bottom: none; }
.detalhe-linha .rotulo { color: var(--text-muted); }
.detalhe-linha .valor { font-weight: 500; text-align: right; }
</style>
</head>
<body>
  <div class="tela">
    <div class="cabecalho">
      <h1>Nenhum registro encontrado.</h1>
      <p>A sua busca não retornou registros.</p>
    </div>
    <div class="corpo"><div class="detalhe-linha"><span class="rotulo">Critério buscado</span><span class="valor">CPF 000.000.000-00</span></div></div>
    
  </div>
</body>
</html>
