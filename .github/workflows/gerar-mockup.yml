name: Gerar mockup de UI

# Disparado pelo Faísca (Agent Studio) via API do GitHub ("disparar workflow"),
# ou manualmente pela aba Actions do repositório.
on:
  workflow_dispatch:
    inputs:
      titulo:
        description: "Título da tela (ex.: Cadastro de fornecedor)"
        required: true
        type: string
      tipo:
        description: "Tipo de tela"
        required: true
        type: choice
        options:
          - formulario
          - lista
          - dashboard
          - detalhe
      campos:
        description: 'Campos, separados por vírgula. Formulário/lista: "Rótulo:tipo" (text, email, tel, textarea, select, status). Dashboard/detalhe: "Rótulo:valor". Empty state: "Mensagem:empty,Rótulo do filtro:valor".'
        required: true
        type: string
      descricao:
        description: "Subtítulo opcional da tela"
        required: false
        type: string
        default: ""
      botao_principal:
        description: "Texto do botão principal (opcional)"
        required: false
        type: string
        default: ""
      botao_secundario:
        description: "Texto do botão secundário (opcional)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    # Todos os inputs chegam aqui como variáveis de ambiente, nunca interpolados
    # direto em comandos de shell — isso evita injeção de comando via texto do input.
    env:
      IN_TITULO: ${{ inputs.titulo }}
      IN_TIPO: ${{ inputs.tipo }}
      IN_CAMPOS: ${{ inputs.campos }}
      IN_DESCRICAO: ${{ inputs.descricao }}
      IN_BOTAO_PRINCIPAL: ${{ inputs.botao_principal }}
      IN_BOTAO_SECUNDARIO: ${{ inputs.botao_secundario }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Cache do navegador (Playwright)
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v1

      - name: Instalar dependências Python
        run: pip install -r scripts/requirements.txt

      - name: Instalar navegador (Playwright)
        run: playwright install --with-deps chromium

      - name: Gerar mockup
        id: gerar
        run: |
          set -e
          SAIDA=$(python3 -
