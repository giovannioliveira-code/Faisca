name: Gerar mockup de UI

# Disparado pelo Faísca (Agent Studio) via API do GitHub ("disparar workflow"),
# ou manualmente pela aba Actions do repositório.
on:
  workflow_dispatch:
    inputs:
      titulo:
        description: "Título da tela (ex.: Cadastro de fornecedor)"
        required: true
        type: string
      tipo:
        description: "Tipo de tela"
        required: true
        type: choice
        options:
          - formulario
          - lista
          - dashboard
          - detalhe
      campos:
        description: 'Campos, separados por vírgula. Formulário/lista: "Rótulo:tipo" (text, email, tel, textarea, select, status). Dashboard/detalhe: "Rótulo:valor".'
        required: true
        type: string
      descricao:
        description: "Subtítulo opcional da tela"
        required: false
        type: string
        default: ""
      botao_principal:
        description: "Texto do botão principal (opcional)"
        required: false
        type: string
        default: ""
      botao_secundario:
        description: "Texto do botão secundário (opcional)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    # Todos os inputs chegam aqui como variáveis de ambiente, nunca interpolados
    # direto em comandos de shell — isso evita injeção de comando via texto do input.
    env:
      IN_TITULO: ${{ inputs.titulo }}
      IN_TIPO: ${{ inputs.tipo }}
      IN_CAMPOS: ${{ inputs.campos }}
      IN_DESCRICAO: ${{ inputs.descricao }}
      IN_BOTAO_PRINCIPAL: ${{ inputs.botao_principal }}
      IN_BOTAO_SECUNDARIO: ${{ inputs.botao_secundario }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Gerar mockup
        id: gerar
        run: |
          set -e
          SAIDA=$(python3 - <<'PY'
          import os, re, unicodedata
          from datetime import datetime

          titulo = os.environ["IN_TITULO"]
          slug = unicodedata.normalize("NFKD", titulo).encode("ascii", "ignore").decode()
          slug = re.sub(r"[^a-zA-Z0-9]+", "-", slug).strip("-").lower() or "tela"
          carimbo = datetime.now().strftime("%Y%m%d-%H%M%S")
          print(f"mockups/{slug}-{carimbo}")
          PY
          )
          echo "saida=${SAIDA}" >> "$GITHUB_OUTPUT"

          python3 scripts/gerar_mockup.py \
            --titulo "$IN_TITULO" \
            --tipo "$IN_TIPO" \
            --campos "$IN_CAMPOS" \
            --descricao "$IN_DESCRICAO" \
            --botao-principal "$IN_BOTAO_PRINCIPAL" \
            --botao-secundario "$IN_BOTAO_SECUNDARIO" \
            --saida "${SAIDA}"

      - name: Commitar mockup gerado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.gerar.outputs.saida }}.html" "${{ steps.gerar.outputs.saida }}.png"
          git commit -m "Mockup gerado via Faisca"
          git push

      - name: Resumo
        run: |
          {
            echo "### Mockup gerado"
            echo "- **Tipo:** ${IN_TIPO}"
            echo "- **Arquivos:** \`${{ steps.gerar.outputs.saida }}.html\` e \`.png\`"
            echo ""
            echo "![mockup](${{ steps.gerar.outputs.saida }}.png)"
          } >> "$GITHUB_STEP_SUMMARY"
